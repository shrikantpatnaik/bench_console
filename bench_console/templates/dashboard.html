{% extends "base.html" %}
{% block title %}OWON XDM1041 + SPE3102 · Bench Console{% endblock %}
{% block content %}
<datalist id="ports"></datalist>
<main>
  <section class="toolbar card" aria-label="Bench controls">
    <div class="toolbar-status"><span id="server-status-dot" class="status-dot"></span><strong id="server-status" role="status">Connecting to app…</strong><small id="bench-connection-summary">Multimeter disconnected · Supply disconnected</small></div>
    <div class="buttons"><button id="toolbar-refresh-ports" class="primary refresh-ports">Scan serial ports</button></div>
  </section>
  <div class="dashboard">
    {% include "_multimeter.html" %}
    {% include "_power_supply.html" %}
  </div>
</main>
{% endblock %}
